[project]
name = "slm-lab"
version = "0.1.0"
description = "A learn-by-doing lab for building, fine-tuning, and distilling small language models — with a biopharma clinical-trial-readout POC."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Track A (from-scratch tiny GPT) + Track B (fine-tune/distill) both run on Apple MLX.
    "mlx>=0.18",
    "mlx-lm>=0.18",
    # Data pipeline + eval
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "requests>=2.32",
    "tqdm>=4.66",
    # Teacher (gold-label generation) + Claude-as-judge
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # Phase 5: package the winner (Qwen TrialScout) as a callable MCP "expert".
    "mcp>=1.2",            # FastMCP server SDK (stdio transport)
    "jsonschema>=4.20",    # validate model output against trial_readout.schema.json
    # Observability: loss curves, eval reports, annotated notebooks
    "matplotlib>=3.9",
    "jupyter>=1.0",
    "pandas>=2.2",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
]

[dependency-groups]
# Dev/learning tools kept separate from the runtime deps above.
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["track-b-trialscout"]

[tool.ruff]
# Notebooks are the committed *learning trail* (exploratory code, kept with outputs on
# purpose — see CLAUDE.md). They're not production code; don't lint them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# slm-lab scripts are deliberately compact and single-purpose. These four rules flag
# intentional house idioms used consistently across the tree, not defects — so we silence
# them rather than churn every script. Everything else (incl. F401 dead-import detection
# and E402 import-ordering) stays ON.
ignore = [
    "E401",  # `import json, sys, time` — one-line imports, used throughout
    "E701",  # `if not x: continue` — compact one-line guards
    "E702",  # `a = 1; b = 2` — packed related statements on one line
    "E741",  # `for l in f` — the JSONL-line idiom (`json.loads(l)`)
]
